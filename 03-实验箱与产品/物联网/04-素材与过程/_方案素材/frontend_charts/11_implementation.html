<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 1600px;
    height: 940px;
    background: #ffffff;
    color: #111111;
    font-family: "Microsoft YaHei", "SimHei", "SimSun", sans-serif;
  }
  .canvas {
    width: 1600px;
    height: 940px;
    padding: 54px 70px;
    background: #fff;
    border: 1px solid #e5e5e5;
  }
  .chart-title {
    font-family: "SimHei", "Microsoft YaHei", sans-serif;
    font-size: 34px;
    font-weight: 700;
    color: #000;
    margin: 0;
    letter-spacing: 0;
  }
  .chart-subtitle {
    font-size: 18px;
    color: #555;
    margin-top: 8px;
    padding-bottom: 14px;
    border-bottom: 3px solid #222;
  }
  .accent-line {
    height: 4px;
    width: 90px;
    background: linear-gradient(90deg, #075FBF, #D98200);
    margin-top: 12px;
  }
  .body { position: relative; height: 760px; margin-top: 34px; }
  .box {
    position: absolute;
    border: 2px solid #777;
    background: #fff;
    color: #111;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    line-height: 1.45;
  }
  .box .k { font-size: 23px; font-weight: 700; color: #000; }
  .box .v { font-size: 18px; color: #222; margin-top: 7px; }
  .box.light { background: #f8f8f8; }
  .num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border: 2px solid #111;
    border-radius: 50%;
    font-weight: 700;
    font-size: 18px;
    margin-bottom: 10px;
    background: #fff;
  }
  .blue-rule { border-top: 5px solid #075FBF; }
  .orange-rule { border-top: 5px solid #D98200; }
  .thin { border-color: #aaa; }
  svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  .note {
    position: absolute;
    left: 60px;
    right: 60px;
    bottom: 22px;
    padding: 18px 24px;
    border-left: 5px solid #111;
    background: #f8f8f8;
    font-size: 20px;
    line-height: 1.5;
    color: #111;
  }
  .mini {
    position: absolute;
    border: 1.6px solid #999;
    background: #fff;
    padding: 10px 12px;
    text-align: center;
    font-size: 17px;
    line-height: 1.35;
  }
  .grid-label { font-weight: 700; font-size: 20px; }
  .room { position:absolute; border: 3px solid #111; background:#fff; }
  .desk { position:absolute; border:1.5px solid #777; background:#f9f9f9; text-align:center; font-size:15px; line-height:1.2; display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="chart-title">实施进度流程图</div>
    <div class="chart-subtitle">从现场确认到验收归档的五阶段实施路径</div>
    <div class="accent-line"></div>
    <div class="body"><svg viewBox="0 0 1460 760">
      <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#333"/></marker></defs>
      <line x1="265" y1="300" x2="315" y2="300" stroke="#333" stroke-width="3" marker-end="url(#arrow)" /><line x1="550" y1="300" x2="600" y2="300" stroke="#333" stroke-width="3" marker-end="url(#arrow)" /><line x1="835" y1="300" x2="885" y2="300" stroke="#333" stroke-width="3" marker-end="url(#arrow)" /><line x1="1120" y1="300" x2="1170" y2="300" stroke="#333" stroke-width="3" marker-end="url(#arrow)" />
    </svg><div class="box blue-rule" style="left:30px;top:150px;width:235px;height:300px;"><span class="num">1</span><div class="k">现场确认</div><div class="v">尺寸 / 电力 / 网络<br>工位与清单深化</div></div><div class="box orange-rule" style="left:315px;top:150px;width:235px;height:300px;"><span class="num">2</span><div class="k">到货部署</div><div class="v">设备清点<br>资产编号<br>环境布置</div></div><div class="box blue-rule" style="left:600px;top:150px;width:235px;height:300px;"><span class="num">3</span><div class="k">平台联调</div><div class="v">服务器部署<br>设备接入<br>数据采集</div></div><div class="box orange-rule" style="left:885px;top:150px;width:235px;height:300px;"><span class="num">4</span><div class="k">资源导入</div><div class="v">课程包<br>账号权限<br>教师培训</div></div><div class="box blue-rule" style="left:1170px;top:150px;width:235px;height:300px;"><span class="num">5</span><div class="k">试运行验收</div><div class="v">基础实验<br>综合项目<br>文档归档</div></div><div class="note">交付资料：深化设计、设备清单、平台账号、课程资源、培训记录、试运行记录、验收报告、运维制度。</div></div>
  </div>
</body>
</html>
