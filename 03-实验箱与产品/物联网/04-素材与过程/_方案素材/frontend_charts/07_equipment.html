<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 1600px;
    height: 940px;
    background: #ffffff;
    color: #111111;
    font-family: "Microsoft YaHei", "SimHei", "SimSun", sans-serif;
  }
  .canvas {
    width: 1600px;
    height: 940px;
    padding: 54px 70px;
    background: #fff;
    border: 1px solid #e5e5e5;
  }
  .chart-title {
    font-family: "SimHei", "Microsoft YaHei", sans-serif;
    font-size: 34px;
    font-weight: 700;
    color: #000;
    margin: 0;
    letter-spacing: 0;
  }
  .chart-subtitle {
    font-size: 18px;
    color: #555;
    margin-top: 8px;
    padding-bottom: 14px;
    border-bottom: 3px solid #222;
  }
  .accent-line {
    height: 4px;
    width: 90px;
    background: linear-gradient(90deg, #075FBF, #D98200);
    margin-top: 12px;
  }
  .body { position: relative; height: 760px; margin-top: 34px; }
  .box {
    position: absolute;
    border: 2px solid #777;
    background: #fff;
    color: #111;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    line-height: 1.45;
  }
  .box .k { font-size: 23px; font-weight: 700; color: #000; }
  .box .v { font-size: 18px; color: #222; margin-top: 7px; }
  .box.light { background: #f8f8f8; }
  .num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border: 2px solid #111;
    border-radius: 50%;
    font-weight: 700;
    font-size: 18px;
    margin-bottom: 10px;
    background: #fff;
  }
  .blue-rule { border-top: 5px solid #075FBF; }
  .orange-rule { border-top: 5px solid #D98200; }
  .thin { border-color: #aaa; }
  svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  .note {
    position: absolute;
    left: 60px;
    right: 60px;
    bottom: 22px;
    padding: 18px 24px;
    border-left: 5px solid #111;
    background: #f8f8f8;
    font-size: 20px;
    line-height: 1.5;
    color: #111;
  }
  .mini {
    position: absolute;
    border: 1.6px solid #999;
    background: #fff;
    padding: 10px 12px;
    text-align: center;
    font-size: 17px;
    line-height: 1.35;
  }
  .grid-label { font-weight: 700; font-size: 20px; }
  .room { position:absolute; border: 3px solid #111; background:#fff; }
  .desk { position:absolute; border:1.5px solid #777; background:#f9f9f9; text-align:center; font-size:15px; line-height:1.2; display:flex; align-items:center; justify-content:center; }
  .lane {
    position: absolute;
    border: 1.8px solid #8a8a8a;
    background: #fff;
    padding: 16px 18px;
    font-size: 18px;
    line-height: 1.42;
  }
  .lane-title {
    font-family: "SimHei", "Microsoft YaHei", sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #000;
    padding-bottom: 8px;
    margin-bottom: 10px;
    border-bottom: 2px solid #cfcfcf;
  }
  .chip {
    display: inline-block;
    margin: 5px 4px;
    padding: 6px 10px;
    border: 1.4px solid #999;
    background: #fafafa;
    font-size: 16px;
    line-height: 1.2;
  }
  .port {
    position: absolute;
    width: 74px;
    height: 48px;
    border: 1.6px solid #777;
    background: #f9f9f9;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 700;
    color: #000;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="chart-title">核心设备组成图</div>
    <div class="chart-subtitle">以鸿蒙物联网实验箱为中心，形成可扩展的分组实训套件</div>
    <div class="accent-line"></div>
    <div class="body"><svg viewBox="0 0 1460 760">
      <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#333"/></marker></defs>
      <line x1="410" y1="170" x2="650" y2="340" stroke="#333" stroke-width="3" marker-end="url(#arrow)" /><line x1="1040" y1="170" x2="810" y2="340" stroke="#333" stroke-width="3" marker-end="url(#arrow)" /><line x1="410" y1="565" x2="650" y2="455" stroke="#333" stroke-width="3" marker-end="url(#arrow)" /><line x1="1040" y1="565" x2="810" y2="455" stroke="#333" stroke-width="3" marker-end="url(#arrow)" /><line x1="725" y1="650" x2="725" y2="500" stroke="#333" stroke-width="3" marker-end="url(#arrow)" /><line x1="725" y1="210" x2="725" y2="340" stroke="#333" stroke-width="3" marker-end="url(#arrow)" />
    </svg><div class="box blue-rule" style="left:580px;top:330px;width:290px;height:155px;"><div class="k">鸿蒙物联网实验箱</div><div class="v">便携一体化 / 模块快接<br>9个通用接口位</div></div><div class="box orange-rule" style="left:90px;top:90px;width:320px;height:120px;"><div class="k">主控开发包</div><div class="v">STM32 / 鸿蒙 / ZigBee</div></div><div class="box blue-rule" style="left:1040px;top:90px;width:340px;height:120px;"><div class="k">通信开发包</div><div class="v">WiFi / 4G / BLE / LoRa / NB-IoT</div></div><div class="box blue-rule" style="left:90px;top:525px;width:320px;height:120px;"><div class="k">传感器开发包</div><div class="v">环境 / 安防 / 农业 / 气体</div></div><div class="box orange-rule" style="left:1040px;top:525px;width:340px;height:120px;"><div class="k">RFID识别开发包</div><div class="v">HF / UHF / NFC / 二维码</div></div><div class="box blue-rule" style="left:565px;top:640px;width:320px;height:100px;"><div class="k">执行器开发包</div><div class="v">风扇 / 水泵 / 舵机 / 灯光</div></div><div class="box orange-rule" style="left:565px;top:90px;width:320px;height:100px;"><div class="k">AIoT教学云平台</div><div class="v">设备 / 任务 / 评价 / 仿真</div></div></div>
  </div>
</body>
</html>
