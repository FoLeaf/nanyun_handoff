<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · SVG 动画</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 50% 20%, #16324d 0%, #0c1f33 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  .stage { width: min(96vw, 980px); padding: 24px 0; }
  svg {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 18px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
    background: #dff1ff;
  }
  .caption {
    text-align: center;
    color: #bcd8f2;
    margin-top: 12px;
    font-size: 14px;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑着自行车前进的二维动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ba3e8"/>
      <stop offset="1" stop-color="#dff1ff"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ecb6d"/>
      <stop offset="1" stop-color="#5ca038"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8c86a"/>
      <stop offset="1" stop-color="#f2a93f"/>
    </linearGradient>
  </defs>

  <!-- 天空 -->
  <rect width="900" height="520" fill="url(#sky)"/>

  <!-- 太阳 -->
  <g>
    <circle cx="800" cy="85" r="62" fill="rgba(255,222,110,0.22)"/>
    <circle cx="800" cy="85" r="34" fill="#ffd75e"/>
    <g stroke="#ffd75e" stroke-width="5" stroke-linecap="round" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="0 800 85" to="360 800 85" dur="36s" repeatCount="indefinite"/>
      <line x1="800" y1="16" x2="800" y2="28"/>
      <line x1="800" y1="142" x2="800" y2="154"/>
      <line x1="716" y1="85" x2="728" y2="85"/>
      <line x1="872" y1="85" x2="884" y2="85"/>
      <line x1="740" y1="25" x2="748" y2="33"/>
      <line x1="852" y1="137" x2="860" y2="145"/>
      <line x1="860" y1="25" x2="852" y2="33"/>
      <line x1="740" y1="145" x2="748" y2="137"/>
    </g>
  </g>

  <!-- 云朵 -->
  <g fill="#ffffff">
    <g opacity="0.95">
      <animateTransform attributeName="transform" type="translate" from="-240 0" to="1180 0" dur="42s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="66" rx="54" ry="17"/>
      <ellipse cx="36" cy="54" rx="34" ry="14"/>
      <ellipse cx="-32" cy="58" rx="28" ry="12"/>
    </g>
    <g opacity="0.9">
      <animateTransform attributeName="transform" type="translate" from="-280 0" to="1220 0" dur="58s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="118" rx="42" ry="13"/>
      <ellipse cx="28" cy="108" rx="26" ry="11"/>
      <ellipse cx="-26" cy="111" rx="22" ry="9"/>
    </g>
    <g opacity="0.85">
      <animateTransform attributeName="transform" type="translate" from="-220 0" to="1180 0" dur="74s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="38" rx="34" ry="10"/>
      <ellipse cx="22" cy="30" rx="22" ry="9"/>
      <ellipse cx="-20" cy="32" rx="18" ry="7"/>
    </g>
  </g>

  <!-- 飞鸟 -->
  <g stroke="#5a6770" stroke-width="2.2" fill="none" stroke-linecap="round">
    <g>
      <animateTransform attributeName="transform" type="translate" from="-40 0" to="1000 0" dur="30s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 10 148; -20 10 148; 0 10 148" keyTimes="0;0.5;1" dur="0.5s" repeatCount="indefinite"/>
        <path d="M0,148 Q10,139 20,148"/>
      </g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="-170 0" to="940 0" dur="24s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 8 104; -22 8 104; 0 8 104" keyTimes="0;0.5;1" dur="0.45s" repeatCount="indefinite"/>
        <path d="M0,104 Q8,97 16,104"/>
      </g>
    </g>
  </g>

  <!-- 远景丘陵 -->
  <path d="M-20,442 Q150,368 320,442 Z" fill="#a3d488"/>
  <path d="M240,442 Q520,348 800,442 Z" fill="#8cc76c"/>
  <path d="M660,442 Q830,376 920,430 L920,442 Z" fill="#a3d488"/>

  <!-- 地面与道路 -->
  <rect y="440" width="900" height="80" fill="url(#groundGrad)"/>
  <rect y="440" width="900" height="12" fill="#a9db8d"/>
  <rect y="474" width="900" height="46" fill="#b6bbc1"/>
  <line x1="0" y1="474" x2="900" y2="474" stroke="#eef2f5" stroke-width="3" opacity="0.55"/>

  <!-- 滚动车道线 -->
  <g id="dashes">
    <rect x="30" y="491" width="36" height="8" rx="4" fill="#f4f6f8" opacity="0.9"/>
    <rect x="110" y="491" width="36" height="8" rx="4" fill="#f4f6f8" opacity="0.9"/>
    <rect x="190" y="491" width="36" height="8" rx="4" fill="#f4f6f8" opacity="0.9"/>
    <rect x="270" y="491" width="36" height="8" rx="4" fill="#f4f6f8" opacity="0.9"/>
    <rect x="350" y="491" width="36" height="8" rx="4" fill="#f4f6f8" opacity="0.9"/>
    <rect x="430" y="491" width="36" height="8" rx="4" fill="#f4f6f8" opacity="0.9"/>
    <rect x="510" y="491" width="36" height="8" rx="4" fill="#f4f6f8" opacity="0.9"/>
    <rect x="590" y="491" width="36" height="8" rx="4" fill="#f4f6f8" opacity="0.9"/>
    <rect x="670" y="491" width="36" height="8" rx="4" fill="#f4f6f8" opacity="0.9"/>
    <rect x="750" y="491" width="36" height="8" rx="4" fill="#f4f6f8" opacity="0.9"/>
    <rect x="830" y="491" width="36" height="8" rx="4" fill="#f4f6f8" opacity="0.9"/>
    <rect x="910" y="491" width="36" height="8" rx="4" fill="#f4f6f8" opacity="0.9"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-80 0" dur="1.4s" repeatCount="indefinite"/>
    <use href="#dashes"/>
    <use href="#dashes" x="960"/>
  </g>

  <!-- 路边灯柱（视差滚动） -->
  <g id="posts">
    <g transform="translate(60,0)">
      <rect x="-4" y="330" width="8" height="128" fill="#8a5a33"/>
      <circle cx="0" cy="320" r="18" fill="#ffd75e" opacity="0.22"/>
      <circle cx="0" cy="320" r="10" fill="#ffe9a8" stroke="#8a5a33" stroke-width="2"/>
    </g>
    <g transform="translate(420,0)">
      <rect x="-4" y="330" width="8" height="128" fill="#8a5a33"/>
      <circle cx="0" cy="320" r="18" fill="#ffd75e" opacity="0.22"/>
      <circle cx="0" cy="320" r="10" fill="#ffe9a8" stroke="#8a5a33" stroke-width="2"/>
    </g>
    <g transform="translate(780,0)">
      <rect x="-4" y="330" width="8" height="128" fill="#8a5a33"/>
      <circle cx="0" cy="320" r="18" fill="#ffd75e" opacity="0.22"/>
      <circle cx="0" cy="320" r="10" fill="#ffe9a8" stroke="#8a5a33" stroke-width="2"/>
    </g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-360 0" dur="5s" repeatCount="indefinite"/>
    <use href="#posts"/>
    <use href="#posts" x="1080"/>
  </g>

  <!-- ================= 主角：鹈鹕骑自行车 ================= -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="-300 0" to="1200 0" dur="14s" repeatCount="indefinite"/>

    <!-- 车轮阴影 -->
    <ellipse cx="250" cy="458" rx="56" ry="7" fill="rgba(0,0,0,0.18)"/>
    <ellipse cx="450" cy="458" rx="56" ry="7" fill="rgba(0,0,0,0.18)"/>

    <!-- 后轮 -->
    <g>
      <circle cx="250" cy="400" r="58" fill="none" stroke="#333333" stroke-width="6"/>
      <circle cx="250" cy="400" r="50" fill="none" stroke="#9a9a9a" stroke-width="2.5"/>
      <g stroke="#c4c4c4" stroke-width="1.6">
        <animateTransform attributeName="transform" type="rotate" from="0 250 400" to="360 250 400" dur="1.6s" repeatCount="indefinite"/>
        <line x1="250" y1="350" x2="250" y2="450"/>
        <line x1="200" y1="400" x2="300" y2="400"/>
        <line x1="214.6" y1="364.6" x2="285.4" y2="435.4"/>
        <line x1="285.4" y1="364.6" x2="214.6" y2="435.4"/>
      </g>
      <circle cx="250" cy="400" r="4.5" fill="#555555"/>
    </g>

    <!-- 前轮 -->
    <g>
      <circle cx="450" cy="400" r="58" fill="none" stroke="#333333" stroke-width="6"/>
      <circle cx="450" cy="400" r="50" fill="none" stroke="#9a9a9a" stroke-width="2.5"/>
      <g stroke="#c4c4c4" stroke-width="1.6">
        <animateTransform attributeName="transform" type="rotate" from="0 450 400" to="360 450 400" dur="1.6s" repeatCount="indefinite"/>
        <line x1="450" y1="350" x2="450" y2="450"/>
        <line x1="400" y1="400" x2="500" y2="400"/>
        <line x1="414.6" y1="364.6" x2="485.4" y2="435.4"/>
        <line x1="485.4" y1="364.6" x2="414.6" y2="435.4"/>
      </g>
      <circle cx="450" cy="400" r="4.5" fill="#555555"/>
    </g>

    <!-- 车架 -->
    <g stroke="#d8433f" stroke-width="7" stroke-linecap="round" fill="none">
      <line x1="330" y1="330" x2="330" y2="400"/>
      <line x1="330" y1="330" x2="420" y2="322"/>
      <line x1="420" y1="322" x2="330" y2="400"/>
      <line x1="330" y1="330" x2="250" y2="400"/>
      <line x1="330" y1="400" x2="250" y2="400"/>
      <line x1="420" y1="322" x2="450" y2="400"/>
      <line x1="420" y1="314" x2="424" y2="336"/>
    </g>
    <g stroke="#3a3a3a" stroke-width="7" stroke-linecap="round" fill="none">
      <line x1="420" y1="322" x2="413" y2="296"/>
      <path d="M392,290 Q420,286 433,299"/>
    </g>
    <path d="M312,330 Q330,318 348,330 Q330,338 312,330 Z" fill="#2e2e2e"/>

    <!-- 牙盘与曲柄 -->
    <g>
      <circle cx="330" cy="400" r="18" fill="none" stroke="#666666" stroke-width="3.5"/>
      <circle cx="330" cy="400" r="5.5" fill="#555555"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 330 400" to="360 330 400" dur="2.4s" repeatCount="indefinite"/>
        <line x1="330" y1="385" x2="330" y2="415" stroke="#3c3c3c" stroke-width="5" stroke-linecap="round"/>
        <rect x="321" y="381.5" width="18" height="7" rx="2.5" fill="#222222"/>
        <rect x="321" y="411.5" width="18" height="7" rx="2.5" fill="#222222"/>
      </g>
    </g>

    <!-- 鹈鹕（含双腿、身体、翅膀） -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" keyTimes="0;0.5;1" dur="1.2s" repeatCount="indefinite"/>

      <!-- 左腿（前腿）：大腿绕髋关节、小腿绕膝关节精确踩踏 -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 330 330; 2.1 330 330; 2.9 330 330; 2.6 330 330; 1.1 330 330; -1.4 330 330; -4.8 330 330; -9.2 330 330; -14.3 330 330; -20.2 330 330; -26.2 330 330; -32.1 330 330; -36.9 330 330; -40.1 330 330; -41.2 330 330; -40.4 330 330; -37.8 330 330; -33.9 330 330; -29.0 330 330; -23.5 330 330; -17.9 330 330; -12.4 330 330; -7.4 330 330; -3.2 330 330; 0 330 330" keyTimes="0.0000; 0.0417; 0.0833; 0.1250; 0.1667; 0.2083; 0.2500; 0.2917; 0.3333; 0.3750; 0.4167; 0.4583; 0.5000; 0.5417; 0.5833; 0.6250; 0.6667; 0.7083; 0.7500; 0.7917; 0.8333; 0.8750; 0.9167; 0.9583; 1.0000" dur="2.4s" repeatCount="indefinite"/>
          <path d="M330,330 C344,336 352,346 357,359" stroke="#e59b72" stroke-width="8" stroke-linecap="round" fill="none"/>
          <g>
            <animateTransform attributeName="transform" type="rotate" values="0 357.2 359.3; 0.9 357.2 359.3; 3.4 357.2 359.3; 7.4 357.2 359.3; 12.6 357.2 359.3; 18.4 357.2 359.3; 24.7 357.2 359.3; 31.1 357.2 359.3; 37.1 357.2 359.3; 42.4 357.2 359.3; 46.6 357.2 359.3; 49.3 357.2 359.3; 50.2 357.2 359.3; 49.3 357.2 359.3; 46.6 357.2 359.3; 42.4 357.2 359.3; 37.1 357.2 359.3; 31.1 357.2 359.3; 24.7 357.2 359.3; 18.4 357.2 359.3; 12.6 357.2 359.3; 7.4 357.2 359.3; 3.4 357.2 359.3; 0.9 357.2 359.3; 0 357.2 359.3" keyTimes="0.0000; 0.0417; 0.0833; 0.1250; 0.1667; 0.2083; 0.2500; 0.2917; 0.3333; 0.3750; 0.4167; 0.4583; 0.5000; 0.5417; 0.5833; 0.6250; 0.6667; 0.7083; 0.7500; 0.7917; 0.8333; 0.8750; 0.9167; 0.9583; 1.0000" dur="2.4s" repeatCount="indefinite"/>
            <path d="M357,359 C347,388 336,402 330,415" stroke="#e59b72" stroke-width="7" stroke-linecap="round" fill="none"/>
            <path d="M321,412 Q332,406 343,411 Q347,417 336,421 Q324,422 319,417 Z" fill="#f7b64a"/>
          </g>
      </g>

      <!-- 右腿（后腿） -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 330 330; -3.2 330 330; -4.4 330 330; -3.5 330 330; -1.0 330 330; 3.0 330 330; 7.9 330 330; 13.3 330 330; 19.0 330 330; 24.4 330 330; 29.4 330 330; 33.7 330 330; 36.9 330 330; 38.9 330 330; 39.8 330 330; 39.4 330 330; 38.0 330 330; 35.5 330 330; 32.1 330 330; 27.7 330 330; 22.5 330 330; 16.7 330 330; 10.6 330 330; 4.8 330 330; 0 330 330" keyTimes="0.0000; 0.0417; 0.0833; 0.1250; 0.1667; 0.2083; 0.2500; 0.2917; 0.3333; 0.3750; 0.4167; 0.4583; 0.5000; 0.5417; 0.5833; 0.6250; 0.6667; 0.7083; 0.7500; 0.7917; 0.8333; 0.8750; 0.9167; 0.9583; 1.0000" dur="2.4s" repeatCount="indefinite"/>
          <path d="M330,330 C346,330 360,332 369,337" stroke="#e59b72" stroke-width="8" stroke-linecap="round" fill="none"/>
          <g>
            <animateTransform attributeName="transform" type="rotate" values="0 369.4 337.1; -0.9 369.4 337.1; -3.7 369.4 337.1; -7.9 369.4 337.1; -13.2 369.4 337.1; -19.2 369.4 337.1; -25.5 369.4 337.1; -31.8 369.4 337.1; -37.7 369.4 337.1; -42.8 369.4 337.1; -46.8 369.4 337.1; -49.3 369.4 337.1; -50.2 369.4 337.1; -49.3 369.4 337.1; -46.8 369.4 337.1; -42.8 369.4 337.1; -37.7 369.4 337.1; -31.8 369.4 337.1; -25.5 369.4 337.1; -19.2 369.4 337.1; -13.2 369.4 337.1; -7.9 369.4 337.1; -3.7 369.4 337.1; -0.9 369.4 337.1; 0 369.4 337.1" keyTimes="0.0000; 0.0417; 0.0833; 0.1250; 0.1667; 0.2083; 0.2500; 0.2917; 0.3333; 0.3750; 0.4167; 0.4583; 0.5000; 0.5417; 0.5833; 0.6250; 0.6667; 0.7083; 0.7500; 0.7917; 0.8333; 0.8750; 0.9167; 0.9583; 1.0000" dur="2.4s" repeatCount="indefinite"/>
            <path d="M369,337 C354,358 340,374 330,385" stroke="#e59b72" stroke-width="7" stroke-linecap="round" fill="none"/>
            <path d="M319,382 Q330,376 341,381 Q345,387 334,391 Q322,392 317,387 Z" fill="#f7b64a"/>
          </g>
      </g>

      <!-- 尾巴 -->
      <path d="M258,272 C232,258 224,274 238,288 C246,294 254,290 258,282 Z" fill="#e9e5da" stroke="#b8b2a2" stroke-width="2"/>

      <!-- 身体 -->
      <ellipse cx="300" cy="288" rx="52" ry="44" fill="#f4f2ec" stroke="#c9c3b4" stroke-width="2"/>

      <!-- 脖子与头 -->
      <path d="M340,260 C375,245 375,185 398,158" stroke="#b8b2a2" stroke-width="21" fill="none" stroke-linecap="round"/>
      <path d="M340,260 C375,245 375,185 398,158" stroke="#f4f2ec" stroke-width="17" fill="none" stroke-linecap="round"/>
      <circle cx="402" cy="150" r="16" fill="#f4f2ec" stroke="#c9c3b4" stroke-width="2"/>

      <!-- 头顶小冠羽 -->
      <path d="M386,140 Q376,130 369,134 Q377,143 375,149 Z" fill="#f4f2ec" stroke="#c9c3b4" stroke-width="1.5"/>
      <path d="M391,135 Q382,122 374,126 Q382,136 380,141 Z" fill="#f4f2ec" stroke="#c9c3b4" stroke-width="1.5"/>

      <!-- 眼睛 -->
      <circle cx="409" cy="142" r="3.4" fill="#1c1c1c"/>
      <circle cx="410" cy="141" r="1.1" fill="#ffffff"/>

      <!-- 上喙（张开动画） -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 405 158; -20 405 158; 0 405 158" keyTimes="0;0.5;1" dur="1.2s" repeatCount="indefinite"/>
        <path d="M406,150 L486,138 Q498,135 496,147 L492,153 Q478,158 414,160 Z" fill="#f7b64a" stroke="#d98a2b" stroke-width="2" stroke-linejoin="round"/>
      </g>

      <!-- 喉囊（下喙） -->
      <path d="M407,160 C426,200 478,192 491,152 Q483,161 468,167 C442,179 418,176 408,166 Z" fill="url(#pouchGrad)" stroke="#e0953a" stroke-width="2"/>
      <path d="M416,168 C436,182 462,180 478,164" stroke="#e0953a" stroke-width="1.5" fill="none" opacity="0.7"/>
      <path d="M422,175 C438,184 456,182 466,174" stroke="#e0953a" stroke-width="1.5" fill="none" opacity="0.5"/>

      <!-- 红色围巾（随风飘动） -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 368 190; 7 368 190; 0 368 190; -5 368 190; 0 368 190" keyTimes="0;0.25;0.5;0.75;1" dur="0.9s" repeatCount="indefinite"/>
        <path d="M368,182 C348,192 318,196 296,190 C306,198 330,202 356,196 Q372,192 374,186 Z" fill="#e5484d"/>
        <path d="M306,192 C290,204 276,208 266,204 C280,214 300,212 314,202 Z" fill="#c93a41"/>
      </g>

      <!-- 翅膀（扇动动画） -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-6 320 280; 22 320 280; -6 320 280" keyTimes="0;0.5;1" dur="0.6s" repeatCount="indefinite"/>
        <path d="M316,278 C356,256 380,250 392,266 C378,290 348,300 316,296 Z" fill="#e9e5da" stroke="#b8b2a2" stroke-width="2"/>
        <path d="M330,278 Q352,268 372,264" stroke="#b8b2a2" stroke-width="1.5" fill="none"/>
        <path d="M328,287 Q348,279 366,277" stroke="#b8b2a2" stroke-width="1.5" fill="none"/>
      </g>
    </g>
  </g>

  <!-- 标题 -->
  <text x="26" y="48" font-size="28" font-weight="700" fill="#ffffff" opacity="0.95" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" stroke="#0c1f33" stroke-width="2" paint-order="stroke">🦩 鹈鹕骑自行车</text>
</svg>
<div class="caption">纯 SVG + SMIL 动画，无 JavaScript —— 轮子、曲柄、踩踏的双腿、扇动的翅膀与张合的喙都在同步运动</div>
</div>
</body>
</html>
